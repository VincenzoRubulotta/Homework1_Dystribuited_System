
networks:
  service_net:
    driver: bridge
  user_db_net:
    driver: bridge
    internal: true 
  data_db_net:
    driver: bridge
    internal: true

    

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - service_net

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - service_net

  api_gateway:
    image: nginx:latest
    container_name: api_gateway
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${API_GATEWAY_PORT}:80"
      - "443:443"
    networks:
      - service_net
    depends_on:
      -  user_manager
      -  data_collector
  db:
    image: postgres:14-alpine 
    container_name: db_user
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userdb
    volumes:
      - db_user_data:/var/lib/postgresql/data 
    expose: 
      - 5432
    networks:
      - user_db_net 
    healthcheck: 
        test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
        interval: 5s
        timeout: 5s
        retries: 5
  
  user_manager:
    build: 
      context: ./user_manager
      dockerfile: Dockerfile
    container_name: user_manager
    environment:
      DB_HOST: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: userdb
      GRPC_PORT: ${UM_PORT:-50051}
      HTTP_PORT: 5000
    expose:
      - ${UM_PORT:-50051}
      - 5000
    networks:
      - user_db_net 
      - service_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
        test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 5s

  db_collector:
    image: postgres:14-alpine
    container_name: collector_db
    environment:
      POSTGRES_USER: collector_user
      POSTGRES_PASSWORD: collector_password
      POSTGRES_DB: collector_db
    volumes:
      - collector_db_data:/var/lib/postgresql/data
    expose:
      - ${DB_PORT}
    networks:
      - data_db_net 
    healthcheck: 
        test: ["CMD-SHELL", "pg_isready -U collector_user -d collector_db"]
        interval: 5s
        timeout: 5s
        retries: 5

  data_collector:
    build:
      context: ./data_collector
      dockerfile: Dockerfile
    container_name: data_collector
    environment:
      DB_HOST: db_collector
      POSTGRES_DB: collector_db
      POSTGRES_USER: collector_user
      POSTGRES_PASSWORD: collector_password
      USER_MANAGER_ADDRESS: user_manager:${UM_PORT--50051}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRPC_PORT: ${DC_PORT:-50052}
      HTTP_PORT: 5001
      MONITORING_INTERVAL: 200
      MONITORING_INTERVAL_HISTORICAL: 43200

    expose:
      - ${DC_PORT:-50052}
      - 5001
    networks:
      - data_db_net 
      - service_net
    depends_on:
      db_collector:
        condition: service_healthy
      user_manager:
        condition: service_healthy

  alert_system:
    build:
      context: ./alert_system
      dockerfile: Dockerfile
    container_name: alert_system
    depends_on:
      - kafka
    networks:
      - service_net
    restart: on-failure
    environment:
      - PYTHONBUFFERED=1
  
  notifier_system:
    build: 
      context: ./notifier_system
      dockerfile: Dockerfile
    container_name: notifier_system
    depends_on:
      - kafka
    networks:
      - service_net
    restart: on-failure
    environment:
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SENDER_EMAIL=${SENDER_EMAIL}
      - SENDER_PASSWORD=${SENDER_PASSWORD}
    

volumes:
  db_user_data: {}      
  collector_db_data: {} 