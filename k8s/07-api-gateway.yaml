apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: gateway-container
        image: api-gateway:v1
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80
        - containerPort: 443
      
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---

apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort     
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080  
    - name: https
      protocol: TCP
      port: 443
      targetPort: 443
      nodePort: 30443  